---
layout: default
---

<article class="article wrap">
  <header class="article-heading">
    <p class="eyebrow">{{ page.eyebrow | default: 'The field guide' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.intro %}
    <p class="intro">{{ page.intro }}</p>
    {% endif %}
  </header>
  <div class="prose">{{ content }}</div>
  <a class="text-link" href="{{ '/' | relative_url }}"
    >← Back to Jot & Tittle</a
  >
</article>
